name: Shared kits integration

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: swiftlint
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned SwiftLint
        run: bash Scripts/install-swiftlint.sh "$RUNNER_TEMP/swiftlint"
      - name: Enforce SwiftLint rules
        env:
          SWIFTLINT_BIN: ${{ runner.temp }}/swiftlint/swiftlint
        run: bash Scripts/lint.sh

  build-and-test:
    needs: swiftlint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.IOS_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      RECORD_SNAPSHOTS: "0"
      SNAPSHOT_RECORD: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Configure read-only private dependency access
        env:
          APPSTUBDATA_DEPLOY_KEY: ${{ secrets.APPSTUBDATA_DEPLOY_KEY }}
          AUTHKIT_DEPLOY_KEY: ${{ secrets.AUTHKIT_DEPLOY_KEY }}
          DEVELOPERPROFILEKIT_DEPLOY_KEY: ${{ secrets.DEVELOPERPROFILEKIT_DEPLOY_KEY }}
          FOUNDATIONKIT_DEPLOY_KEY: ${{ secrets.FOUNDATIONKIT_DEPLOY_KEY }}
          LOCALIZATIONKIT_DEPLOY_KEY: ${{ secrets.LOCALIZATIONKIT_DEPLOY_KEY }}
          COMMONNETWORKING_DEPLOY_KEY: ${{ secrets.COMMONNETWORKING_DEPLOY_KEY }}
          DESIGNTOKENSKIT_DEPLOY_KEY: ${{ secrets.DESIGNTOKENSKIT_DEPLOY_KEY }}
          UICOMPONENTSKIT_DEPLOY_KEY: ${{ secrets.UICOMPONENTSKIT_DEPLOY_KEY }}
          SNAPSHOTTESTKIT_DEPLOY_KEY: ${{ secrets.SNAPSHOTTESTKIT_DEPLOY_KEY }}
        run: bash Scripts/configure-private-dependencies.sh

      - name: Fetch pinned private submodules
        run: git submodule update --init --recursive

      - name: Select validated Xcode toolchain
        run: |
          xcode_path="/Applications/Xcode_27.1.app/Contents/Developer"
          if [ ! -d "$xcode_path" ]; then xcode_path="/Applications/Xcode 27.1.app/Contents/Developer"; fi
          test -d "$xcode_path" || { echo "Runner requires Xcode 27.1; configure IOS_CI_RUNNER for a compatible runner."; exit 1; }
          echo "DEVELOPER_DIR=$xcode_path" >> "$GITHUB_ENV"


      - name: Verify submodules
        run: python3 Scripts/verify-submodules.py

      - name: Check design tokens compliance
        run: python3 Scripts/check_design_tokens.py

      - name: Verify and resolve exact package pins
        run: |
          python3 Scripts/verify_pins.py
          xcodebuild -resolvePackageDependencies -project MotivationDaily.xcodeproj -scheme MotivationDaily -onlyUsePackageVersionsFromResolvedFile -scmProvider system
          python3 Scripts/verify_pins.py
          git diff --exit-code -- '*.resolved'

      - name: Test stub fixtures
        run: python3 TestSupport/run-stub-fixtures-tests.py

      - name: Create baseline simulator
        run: |
          device_id=$(xcrun simctl create "Motivation CI iPhone 11" com.apple.CoreSimulator.SimDeviceType.iPhone-11 com.apple.CoreSimulator.SimRuntime.iOS-27-0 || xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b || true
          echo "TEST_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"

      - name: Run Fast test lane (PR and Push)
        run: bash Scripts/test-fast.sh

      - name: Run UI Smoke test lane (PR and Push)
        run: bash Scripts/test-smoke.sh

      - name: Compare reviewed snapshots on pinned iPhone 11 runtime
        run: bash Scripts/test-snapshots.sh

      - name: Run Integration & Performance test lanes (Merge to main & Scheduled)
        if: github.event_name != 'pull_request'
        run: |
          bash Scripts/test-integration.sh
          bash Scripts/test-performance.sh

      - name: Build app Release for iOS Simulator
        run: >-
          xcodebuild -project MotivationDaily.xcodeproj -scheme MotivationDaily
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/AppDerived"
          -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution
          -scmProvider system CODE_SIGNING_ALLOWED=NO build

      - name: Verify Release fixture boundaries
        run: |
          python3 Scripts/verify-release-fixtures.py "$RUNNER_TEMP/AppDerived/Build/Products/Release-iphonesimulator/MotivationDaily.app"
          xcodebuild test -project MotivationDaily.xcodeproj -scheme MotivationDaily \
            -configuration Release -destination "$TEST_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/AppDerived" \
            -resultBundlePath "$RUNNER_TEMP/ReleaseFixtureBoundary.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            -scmProvider system CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            -parallel-testing-enabled NO -only-testing:MotivationDailyTests/FixtureBoundaryTests

      - name: Verify snapshot and XCTest exclusion from Release
        run: python3 Scripts/verify-snapshot-boundary.py "$RUNNER_TEMP/AppDerived/Build/Products/Release-iphonesimulator/MotivationDaily.app/MotivationDaily"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: motivation-integration-results
          path: |
            ${{ runner.temp }}/*.xcresult
            /tmp/*.xcresult
            MotivationDailySnapshotTests/__Snapshots__/**/*.diff.png

      - name: Remove dependency credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/shared-kit-credentials"
          echo "GIT_CONFIG_GLOBAL=/dev/null" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh" >> "$GITHUB_ENV"
