name: Owner Review Notifications

on:
  pull_request:
    types: [review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post owner review notification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owners = ['anurag-chourasia', 'anurag-chourasia-ios', 'sudeepa88'];
            const pr = context.payload.pull_request;
            const eventAction = context.payload.action;

            // --- Review Requested ---
            if (eventAction === 'review_requested') {
              const reviewer = context.payload.requested_reviewer?.login;
              if (!reviewer) return;

              if (!owners.includes(reviewer.toLowerCase())) {
                console.log(`${reviewer} is not an owner — skipping.`);
                return;
              }

              const requester = context.payload.sender.login;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `👀 **@${requester}** requested a review from **@${reviewer}** on behalf of **owners**`
              });
              return;
            }

            // --- Review Submitted (Approved) ---
            if (eventAction === 'submitted') {
              const review = context.payload.review;
              if (review.state !== 'approved') return;

              const reviewer = review.user.login;
              const prAuthor = pr.user.login;

              if (reviewer.toLowerCase() === prAuthor.toLowerCase()) {
                console.log('Reviewer is the PR author — skipping.');
                return;
              }

              if (!owners.includes(reviewer.toLowerCase())) {
                console.log(`${reviewer} is not an owner — skipping.`);
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `✅ **@${reviewer}** approved on behalf of **owners**`
              });
            }
