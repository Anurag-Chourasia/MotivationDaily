name: Owner Review Notifications

on:
  pull_request:
    types: [review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post owner review notification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const eventAction = context.payload.action;

            // Dynamically load owners from .github/CODEOWNERS
            let ownersDisplayList = ['@Anurag-Chourasia', '@Anurag-Chourasia-iOS', '@Sudeepa88'];
            let owners = ownersDisplayList.map(h => h.replace('@', '').toLowerCase());

            try {
              const codeownersFile = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/CODEOWNERS',
                ref: pr.head.ref || pr.base.ref
              });
              const raw = Buffer.from(codeownersFile.data.content, 'base64').toString('utf8');
              const handles = raw.match(/@([a-zA-Z0-9-_]+)/g);
              if (handles && handles.length > 0) {
                ownersDisplayList = [...new Set(handles)];
                owners = ownersDisplayList.map(h => h.replace('@', '').toLowerCase());
              }
            } catch (err) {
              console.log('Using default owners list due to error reading CODEOWNERS:', err.message);
            }

            const ownersGroupDisplay = `**owners** (${ownersDisplayList.join(', ')})`;

            // --- Review Requested ---
            if (eventAction === 'review_requested') {
              const reviewer = context.payload.requested_reviewer?.login;
              if (!reviewer) return;

              if (!owners.includes(reviewer.toLowerCase())) {
                console.log(`${reviewer} is not in the owners group — skipping.`);
                return;
              }

              const requester = context.payload.sender.login;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `👀 **@${requester}** requested a review from **@${reviewer}** on behalf of ${ownersGroupDisplay}`
              });
              return;
            }

            // --- Review Submitted (Approved) ---
            if (eventAction === 'submitted') {
              const review = context.payload.review;
              if (review.state !== 'approved') return;

              const reviewer = review.user.login;
              const prAuthor = pr.user.login;

              if (reviewer.toLowerCase() === prAuthor.toLowerCase()) {
                console.log('Reviewer is the PR author — skipping.');
                return;
              }

              if (!owners.includes(reviewer.toLowerCase())) {
                console.log(`${reviewer} is not in the owners group — skipping.`);
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `✅ **@${reviewer}** approved on behalf of ${ownersGroupDisplay}`
              });
            }
